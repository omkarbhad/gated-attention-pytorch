[project]
name = "gated-attention-pytorch"
version = "0.1.0"
description = "Gated attention (Qwen team, 2025) in PyTorch: a sigmoid gate on the attention output, with tools to measure gate sparsity and the attention sink."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gated_attention"]

[tool.pytest.ini_options]
testpaths = ["tests"]
